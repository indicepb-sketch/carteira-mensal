name: Atualizacao diaria da carteira

on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes opcional no formato YYYY-MM"
        required: false
        type: string
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carteira_mensal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: carteira_mensal/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Atualizar carteira/parcial
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.mes }}" ]; then
            python scripts/atualizacao_diaria.py --mes "${{ github.event.inputs.mes }}" --allow-network
          else
            python scripts/atualizacao_diaria.py --allow-network
          fi

      - name: Commit dos arquivos atualizados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza carteira diaria"
          file_pattern: |
            carteira_mensal/output/excel/*.xlsx
            carteira_mensal/output/logs/*.log
            carteira_mensal/data/raw/*
            carteira_mensal/data/processed/*.csv
